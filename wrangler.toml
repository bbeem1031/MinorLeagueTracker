# wrangler.toml
# Deploy:   wrangler deploy --name milb-card-proxy
# Secrets:  wrangler secret put EBAY_CLIENT_ID
#           wrangler secret put EBAY_CLIENT_SECRET

name               = "milb-card-proxy"
main               = "worker/ebay-proxy.js"
compatibility_date = "2024-09-23"

[vars]
ENVIRONMENT      = "production"
EBAY_ENVIRONMENT = "production"
ALLOWED_ORIGIN   = "https://bbeem1031.github.io"
