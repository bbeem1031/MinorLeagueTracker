# wrangler.toml
# Cloudflare Workers config for MiLB eBay proxy
#
# Deploy:   wrangler deploy --name milb-card-proxy
# Secret:   wrangler secret put EBAY_APP_ID
#           (paste your eBay App ID / Client ID when prompted)

name               = "milb-card-proxy"
main               = "worker/ebay-proxy.js"
compatibility_date = "2024-09-23"

[vars]
ENVIRONMENT      = "production"
EBAY_ENVIRONMENT = "production"
ALLOWED_ORIGIN   = "https://bbeem1031.github.io"
